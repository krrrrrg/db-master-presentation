<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MOU 제안서 - 카존코리아 × 한국보험금융 시그니처사업부</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#000;overflow:hidden;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;cursor:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.slide *{word-break:keep-all;overflow-wrap:break-word}

.cursor{position:fixed;width:20px;height:20px;border:2px solid rgba(20,184,166,0.8);border-radius:50%;pointer-events:none;z-index:99999;transition:transform .15s ease,opacity .3s;mix-blend-mode:difference}
.cursor-dot{position:fixed;width:6px;height:6px;background:#14b8a6;border-radius:50%;pointer-events:none;z-index:99999;transition:transform .05s,opacity .3s}

.presentation{position:relative;width:1280px;height:720px;transform-origin:center center;overflow:hidden;border-radius:4px;box-shadow:0 0 80px rgba(0,0,0,0.5)}

/* Slide system */
.slide{position:absolute;top:0;left:0;width:1280px;height:720px;opacity:0;visibility:hidden;transition:none;overflow:hidden}
.slide.active{opacity:1;visibility:visible}

/* Animated elements */
.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.reveal.show{opacity:1;transform:translateY(0)}
.reveal-scale{opacity:0;transform:scale(.85);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.reveal-scale.show{opacity:1;transform:scale(1)}
.reveal-blur{opacity:0;filter:blur(10px);transition:opacity 1s cubic-bezier(.16,1,.3,1),filter 1s cubic-bezier(.16,1,.3,1)}
.reveal-blur.show{opacity:1;filter:blur(0)}

/* Progress bar */
.progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#14b8a6,#2dd4bf);z-index:9999;transition:width .5s cubic-bezier(.16,1,.3,1)}

/* Slide number */
.slide-num{position:fixed;bottom:30px;right:40px;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:rgba(255,255,255,0.5);z-index:9998;letter-spacing:2px;transition:color .3s}

/* Navigation dots */
.nav-dots{position:fixed;right:30px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:9998;opacity:0;transition:opacity .3s}
body:hover .nav-dots{opacity:1}
.nav-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:all .3s;position:relative}
.nav-dot.active{background:#14b8a6;box-shadow:0 0 12px rgba(20,184,166,0.5)}
.nav-dot:hover{background:rgba(255,255,255,0.5);transform:scale(1.3)}
.nav-dot.active:hover{background:#14b8a6}

/* Particles */
.particle{position:absolute;border-radius:50%;pointer-events:none;animation:float linear infinite}
@keyframes float{0%{transform:translateY(0) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-720px) rotate(720deg);opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(20,184,166,0.2)}50%{box-shadow:0 0 40px rgba(20,184,166,0.4)}}
@keyframes gradient-shift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* ======================== SLIDE 1: TITLE ======================== */
.m1{background:#0a0e1a}
.m1 .bg-mesh{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 30% 70%,rgba(20,184,166,0.12) 0%,transparent 50%),radial-gradient(ellipse at 70% 30%,rgba(13,148,136,0.15) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(15,23,42,0.5) 0%,transparent 70%);z-index:1}
.m1 .content{position:relative;z-index:10;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 80px}
.m1 .eyebrow{font-family:'Space Grotesk',sans-serif;font-size:13px;color:#14b8a6;letter-spacing:4px;margin-bottom:28px;font-weight:500}
.m1 .partners{display:flex;align-items:center;gap:28px;margin-bottom:28px}
.m1 .partner{font-size:30px;font-weight:900;color:#fff;letter-spacing:-1px}
.m1 .partner .sub{display:block;font-size:13px;font-weight:500;color:rgba(255,255,255,.4);letter-spacing:0;margin-top:6px}
.m1 .x-mark{font-size:24px;color:#2dd4bf;font-weight:300}
.m1 h1{font-size:60px;font-weight:900;color:#fff;line-height:1.2;letter-spacing:-3px;margin-bottom:20px}
.m1 h1 .accent{background:linear-gradient(135deg,#14b8a6,#2dd4bf);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.m1 .tagline{font-size:17px;color:rgba(255,255,255,.5);line-height:1.8}

/* ======================== PLACEHOLDER ======================== */
.m-placeholder{background:linear-gradient(135deg,#f0fdfa,#e6fffa)}
.m-placeholder .content{position:relative;z-index:10;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 80px}
.m-placeholder .icon{font-size:64px;color:#14b8a6;opacity:.4;margin-bottom:28px}
.m-placeholder h2{font-size:34px;font-weight:800;color:#0f3d39;margin-bottom:14px}
.m-placeholder p{font-size:16px;color:#5b7a76;line-height:1.7}

/* Back button */
.back-btn{position:fixed;top:20px;left:20px;z-index:99998;width:40px;height:40px;border:none;border-radius:10px;background:rgba(15,23,42,.6);backdrop-filter:blur(8px);color:rgba(255,255,255,.6);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;opacity:0}
body:hover .back-btn{opacity:1}
.back-btn:hover{background:rgba(20,184,166,.5);color:#fff}
</style>
</head>
<body>

<!-- Fullscreen splash -->
<div id="splash" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0e1a;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .6s" onclick="enterFullscreen()">
    <img src="img/logo-white.png" alt="시그니처" style="height:36px;opacity:.6;margin-bottom:32px"/>
    <div style="font-family:'Space Grotesk',sans-serif;font-size:16px;color:rgba(255,255,255,.5);letter-spacing:3px;margin-bottom:40px">MOU 제안서</div>
    <div style="padding:14px 40px;border:1px solid rgba(20,184,166,.4);border-radius:12px;font-size:15px;color:#2dd4bf;font-weight:600;letter-spacing:1px;transition:all .3s;animation:glow 2s ease-in-out infinite" onmouseenter="this.style.background='rgba(20,184,166,.1)'" onmouseleave="this.style.background='transparent'">
        <i class="fas fa-expand" style="margin-right:8px"></i>전체화면으로 시작
    </div>
    <div style="font-size:12px;color:rgba(255,255,255,.2);margin-top:20px">또는 아무 곳이나 클릭하세요</div>
</div>

<button class="back-btn" onclick="window.location.href='index.html'" title="메뉴로 돌아가기"><i class="fas fa-arrow-left"></i></button>

<div class="cursor" id="cursor"></div>
<div class="cursor-dot" id="cursorDot"></div>
<div class="progress-bar" id="progressBar"></div>
<div class="slide-num" id="slideNum">01 / 02</div>
<div class="nav-dots" id="navDots"></div>

<div class="presentation" id="presentation">

<!-- ==================== SLIDE 1: TITLE ==================== -->
<div class="slide m1 active" data-slide="0">
    <div class="bg-mesh"></div>
    <div class="content">
        <div class="eyebrow reveal" style="transition-delay:.2s">BUSINESS PARTNERSHIP PROPOSAL</div>
        <div class="partners reveal" style="transition-delay:.35s">
            <div class="partner">카존코리아<span class="sub">KAZON KOREA</span></div>
            <div class="x-mark">&times;</div>
            <div class="partner">한국보험금융<span class="sub">시그니처사업부</span></div>
        </div>
        <h1 class="reveal" style="transition-delay:.55s"><span class="accent">MOU</span> 제안서</h1>
        <div class="tagline reveal" style="transition-delay:.75s">
            상호 협력을 통한 동반 성장 파트너십
        </div>
    </div>
</div>

<!-- ==================== SLIDE 2: PLACEHOLDER ==================== -->
<div class="slide m-placeholder" data-slide="1">
    <div class="content">
        <div class="icon reveal" style="transition-delay:.1s"><i class="fas fa-file-signature"></i></div>
        <h2 class="reveal" style="transition-delay:.25s">제안서 내용 준비 중</h2>
        <p class="reveal" style="transition-delay:.4s">세부 내용이 확정되는 대로 이 자리에 채워집니다.</p>
    </div>
</div>

</div>

<script>
// Fullscreen
function enterFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.msRequestFullscreen) el.msRequestFullscreen();
    document.getElementById('splash').style.opacity = '0';
    setTimeout(() => { document.getElementById('splash').style.display = 'none'; }, 600);
}

// Custom cursor
const cursor = document.getElementById('cursor');
const cursorDot = document.getElementById('cursorDot');
let mouseX = 0, mouseY = 0, cursorX = 0, cursorY = 0;
let hideTimer = null;
function showCursor() { document.body.style.cursor = ''; cursor.style.opacity = '1'; cursorDot.style.opacity = '1'; }
function hideCursor() {
    const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    if (!isFs) return;
    document.body.style.cursor = 'none'; cursor.style.opacity = '0'; cursorDot.style.opacity = '0';
}
document.addEventListener('mousemove', e => {
    mouseX = e.clientX; mouseY = e.clientY;
    cursorDot.style.left = (mouseX - 3) + 'px';
    cursorDot.style.top = (mouseY - 3) + 'px';
    showCursor();
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideCursor, 2000);
});
function animateCursor() {
    cursorX += (mouseX - cursorX) * 0.35;
    cursorY += (mouseY - cursorY) * 0.35;
    cursor.style.left = (cursorX - 10) + 'px';
    cursor.style.top = (cursorY - 10) + 'px';
    requestAnimationFrame(animateCursor);
}
animateCursor();

// Slide system
let current = 0;
const slides = document.querySelectorAll('.slide');
const total = slides.length;
const progressBar = document.getElementById('progressBar');
const slideNum = document.getElementById('slideNum');
const navDots = document.getElementById('navDots');
let isTransitioning = false;

for (let i = 0; i < total; i++) {
    const dot = document.createElement('div');
    dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', () => goToSlide(i));
    navDots.appendChild(dot);
}

const darkSlides = [0];

function updateUI() {
    progressBar.style.width = ((current + 1) / total * 100) + '%';
    slideNum.textContent = String(current + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0');
    slideNum.style.color = darkSlides.includes(current) ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.25)';
    document.querySelectorAll('.nav-dot').forEach((d, i) => d.classList.toggle('active', i === current));
}

function triggerReveals(slide) {
    const els = slide.querySelectorAll('.reveal,.reveal-scale,.reveal-blur');
    els.forEach(el => el.classList.remove('show'));
    requestAnimationFrame(() => { setTimeout(() => { els.forEach(el => el.classList.add('show')); }, 100); });
}
function resetReveals(slide) {
    slide.querySelectorAll('.reveal,.reveal-scale,.reveal-blur').forEach(el => el.classList.remove('show'));
}

function goToSlide(n) {
    if (n === current || isTransitioning || n < 0 || n >= total) return;
    isTransitioning = true;
    const oldSlide = slides[current];
    const newSlide = slides[n];
    const direction = n > current ? 1 : -1;
    oldSlide.style.transition = 'opacity .6s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1)';
    newSlide.style.transition = 'opacity .6s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1)';
    newSlide.style.opacity = '0';
    newSlide.style.transform = `translateX(${direction * 60}px)`;
    newSlide.style.visibility = 'visible';
    newSlide.classList.add('active');
    requestAnimationFrame(() => {
        oldSlide.style.opacity = '0';
        oldSlide.style.transform = `translateX(${-direction * 60}px)`;
        newSlide.style.opacity = '1';
        newSlide.style.transform = 'translateX(0)';
    });
    setTimeout(() => {
        oldSlide.classList.remove('active');
        oldSlide.style.transition = 'none';
        oldSlide.style.transform = '';
        oldSlide.style.opacity = '';
        newSlide.style.transition = 'none';
        newSlide.style.transform = '';
        resetReveals(oldSlide);
        current = n;
        updateUI();
        triggerReveals(newSlide);
        isTransitioning = false;
    }, 650);
}

function changeSlide(dir) {
    const next = current + dir;
    if (next >= 0 && next < total) goToSlide(next);
}

// Keyboard
document.addEventListener('keydown', e => {
    if (['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)) { e.preventDefault(); changeSlide(1); }
    else if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)) { e.preventDefault(); changeSlide(-1); }
    else if (e.key === 'Home') { e.preventDefault(); goToSlide(0); }
    else if (e.key === 'End') { e.preventDefault(); goToSlide(total - 1); }
    else if (e.key === 'Escape') { window.location.href = 'index.html'; }
});

// Touch / wheel
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
document.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) changeSlide(diff > 0 ? 1 : -1);
});
let wheelLock = false;
document.addEventListener('wheel', e => {
    if (wheelLock) return;
    wheelLock = true;
    if (e.deltaY > 30) changeSlide(1);
    else if (e.deltaY < -30) changeSlide(-1);
    setTimeout(() => { wheelLock = false; }, 800);
}, { passive: true });

// Scale
function scalePresentation() {
    const p = document.getElementById('presentation');
    const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    p.style.transform = `scale(${s})`;
}
window.addEventListener('resize', scalePresentation);
scalePresentation();

// Init
updateUI();
triggerReveals(slides[0]);

// Particles on dark slides
function addParticles(slide) {
    for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.bottom = '-10px';
        p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
        p.style.background = `rgba(20,184,166,${Math.random() * 0.3 + 0.1})`;
        p.style.animationDuration = (Math.random() * 15 + 10) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        slide.appendChild(p);
    }
}
darkSlides.forEach(i => addParticles(slides[i]));
</script>
</body>
</html>
